name: covoiturage

services:
  php:
    build:
      context: ./docker/php
    # Même identifiant que l'utilisateur de la machine hôte (1000 sur la plupart des systèmes Linux) :
    # les fichiers créés dans le projet lui appartiennent et PHP peut écrire dans var/.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
      # Cette variable d'environnement a priorité sur celle du fichier .env.
      DATABASE_URL: "mysql://${DB_USER:-covoiturage}:${DB_PASSWORD:-local_uniquement}@db:3306/${DB_NAME:-covoiturage}?serverVersion=8.4&charset=utf8mb4"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    # Prêt une fois les dépendances installées, la base migrée et les données de démonstration chargées.
    healthcheck:
      test: ["CMD-SHELL", "test -f var/.ready"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    # Prêt quand la page d'accueil répond à travers toute la chaîne : Nginx, PHP-FPM, Symfony et MySQL.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # La base n'est pas exposée sur la machine hôte.
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_NAME:-covoiturage}"
      MYSQL_USER: "${DB_USER:-covoiturage}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-local_uniquement}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Base dédiée aux tests automatisés, en mémoire, démarrée uniquement avec le profil « test ».
  db_test:
    image: mysql:8.4
    profiles: ["test"]
    environment:
      MYSQL_DATABASE: covoiturage_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -utest -ptest --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  db_data:
