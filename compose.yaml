name: covoiturage

services:
  php:
    build:
      context: ./docker/php
    environment:
      # Cette variable d'environnement a priorité sur celle du fichier .env.
      DATABASE_URL: "mysql://${DB_USER:-covoiturage}:${DB_PASSWORD:-local_uniquement}@db:3306/${DB_NAME:-covoiturage}?serverVersion=8.4&charset=utf8mb4"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # La base n'est pas exposée sur la machine hôte.
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_NAME:-covoiturage}"
      MYSQL_USER: "${DB_USER:-covoiturage}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-local_uniquement}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  db_data:
