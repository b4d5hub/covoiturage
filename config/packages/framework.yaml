# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Les adresses des fichiers publics portent leur date de modification : après une mise à jour,
    # le navigateur charge la nouvelle version au lieu de celle gardée en cache.
    assets:
        version_strategy: App\Asset\FileVersionStrategy

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
